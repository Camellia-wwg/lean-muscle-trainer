<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="薄肌">
<meta name="theme-color" content="#f7f7f5">
<title>薄肌训练</title>
<style>
/* ===== 设计令牌 ===== */
:root{
  color-scheme:light;
  /* 间距：8 基准 */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  /* 字阶：六级 */
  --f1:12px;--f2:14px;--f3:16px;--f4:20px;--f5:28px;--f6:40px;
  /* 圆角：两档 */
  --r1:8px;--r2:14px;
  /* 颜色：一色一职 */
  --bg:#f7f7f5;--panel:#fff;--panel2:#fbfbf9;
  --line:#e7e6e0;--line2:#d5d4cc;
  --t1:#111110;--t2:#5c5b57;--t3:#918f88;
  --accent:#1f6fd0;--accent-soft:#e8f0fb;--on-accent:#fff;
  --ok:#12760f;--ok-soft:#e6f2e6;
  --warn:#9a6200;--warn-soft:#faf1de;
  --danger:#bc3025;--danger-soft:#fbeae8;
  --nav:60px;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0e0e0d;--panel:#1a1a18;--panel2:#161615;
  --line:#2b2b28;--line2:#3a3a36;
  --t1:#f5f5f2;--t2:#b5b3ab;--t3:#84827b;
  --accent:#5ea0ea;--accent-soft:#15263a;--on-accent:#08111c;
  --ok:#5cbf58;--ok-soft:#132512;
  --warn:#d09a3c;--warn-soft:#2a2113;
  --danger:#e2695e;--danger-soft:#2c1614;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  background:var(--bg);color:var(--t1);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:var(--f3);line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--s4)}

/* ===== 页头 ===== */
.hd{display:flex;align-items:center;gap:var(--s3);padding:calc(env(safe-area-inset-top,0px) + var(--s5)) 0 var(--s4)}
.hd .meta{font-size:var(--f1);color:var(--t3);letter-spacing:.04em;text-transform:none}
.hd h1{margin:var(--s1) 0 0;font-size:var(--f4);font-weight:640;letter-spacing:-.01em;line-height:1.2}
.hd .gear{margin-left:auto;width:var(--s7);height:var(--s7);border:none;background:none;color:var(--t3);
  font-size:var(--f4);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;border-radius:var(--r1)}
.hd .gear:active{background:var(--line)}

.view{display:none}.view.on{display:block}

/* ===== 主角：今日状态 ===== */
.today{padding:var(--s2) 0 var(--s5)}
.today .kind{display:flex;align-items:center;gap:var(--s3)}
.today .badge{
  width:var(--s7);height:var(--s7);border-radius:var(--r2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:var(--f4);font-weight:700;background:var(--t1);color:var(--bg);
}
.today .badge.rest{background:var(--line);color:var(--t3)}
.today h2{margin:0;font-size:var(--f5);font-weight:680;letter-spacing:-.02em;line-height:1.15}
.today .when{margin:var(--s3) 0 0;font-size:var(--f2);color:var(--t2)}
.today .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:var(--s4)}
.today .track i{display:block;height:100%;background:var(--t1);border-radius:3px;transition:width .3s ease}
.today .count{margin-top:var(--s2);font-size:var(--f2);color:var(--t2);font-variant-numeric:tabular-nums}

/* ===== 分组标题 ===== */
.gt{font-size:var(--f1);letter-spacing:.08em;color:var(--t3);font-weight:600;margin:var(--s5) 0 var(--s2)}

/* ===== 面板与行 ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.panel + .panel{margin-top:var(--s2)}
.rowline{border-top:1px solid var(--line)}
.rowline:first-child{border-top:none}

/* 可折叠区块（热身/收尾） */
.fold>summary{
  list-style:none;cursor:pointer;min-height:var(--s7);
  display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);
  font-size:var(--f3);font-weight:560;
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .sub{margin-left:auto;font-size:var(--f2);color:var(--t3);font-weight:400}
.fold>summary .chev{color:var(--t3);font-size:var(--f2);transition:transform .18s}
.fold[open]>summary .chev{transform:rotate(180deg)}
.fold .body{padding:0 var(--s4) var(--s3);border-top:1px solid var(--line)}
.fold .body li{font-size:var(--f2);color:var(--t2);margin:var(--s2) 0;line-height:1.55}
.fold .body ul{margin:var(--s3) 0 0;padding-left:var(--s4)}

/* ===== 动作行（手风琴） ===== */
.ex{border-top:1px solid var(--line)}
.ex:first-child{border-top:none}
.exhead{
  width:100%;min-height:var(--s7);display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);background:none;border:none;font-family:inherit;
  color:var(--t1);cursor:pointer;text-align:left;
}
.exhead .idx{
  flex:0 0 24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:var(--f1);font-weight:650;color:var(--t3);background:var(--line);font-variant-numeric:tabular-nums;
}
.ex.done .exhead .idx{background:var(--ok-soft);color:var(--ok)}
.ex.open .exhead .idx{background:var(--t1);color:var(--bg)}
.exhead .nm{flex:1;min-width:0;font-size:var(--f3);font-weight:560;line-height:1.35;overflow-wrap:anywhere}
.ex.done .exhead .nm{color:var(--t3)}
.exhead .tally{font-size:var(--f2);color:var(--t3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ex.done .exhead .tally{color:var(--ok)}
.exbody{padding:0 var(--s4) var(--s4) calc(var(--s4) + 24px + var(--s3));display:none}
.ex.open .exbody{display:block}
.exbody .presc{font-size:var(--f2);color:var(--t2);margin-bottom:var(--s3);font-variant-numeric:tabular-nums}

/* 组按钮：最小 48，实际 56 */
.sets{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.set{
  width:56px;height:56px;border-radius:var(--r1);border:1.5px solid var(--line2);
  background:var(--panel2);color:var(--t2);font-family:inherit;font-size:var(--f3);font-weight:600;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s,color .12s;
}
.set.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set:active{transform:scale(.95)}

.field{margin-bottom:var(--s3)}
.field .lastv{font-size:var(--f1);color:var(--t3);margin-bottom:var(--s1);font-variant-numeric:tabular-nums}
input,select,textarea{
  font-family:inherit;font-size:var(--f3);width:100%;min-height:var(--s7);
  padding:0 var(--s3);border-radius:var(--r1);border:1.5px solid var(--line2);
  background:var(--panel2);color:var(--t1);
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

.howtog{
  background:none;border:none;font-family:inherit;font-size:var(--f2);color:var(--accent);
  padding:var(--s2) 0;cursor:pointer;min-height:var(--s7);display:flex;align-items:center;
}
.how{font-size:var(--f2);color:var(--t2);line-height:1.6;display:none;padding-bottom:var(--s2)}
.how.on{display:block}
.how b{color:var(--t1);font-weight:600}

.badbox{
  margin:var(--s3) 0 0;padding:var(--s3);border-radius:var(--r1);
  background:var(--warn-soft);color:var(--t2);line-height:1.6;
}
.badbox b{color:var(--warn);font-weight:600}
.vbtn{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--s7);margin-top:var(--s3);
  border-radius:var(--r1);border:1.5px solid var(--line2);background:var(--panel);
  color:var(--accent);font-size:var(--f2);font-weight:600;text-decoration:none;
}
.vbtn:active{opacity:.85}
.vlnk{
  color:var(--accent);font-size:var(--f1);text-decoration:none;
  white-space:nowrap;font-weight:600;
}

/* ===== 按钮 ===== */
.btn{
  font-family:inherit;font-size:var(--f3);font-weight:600;min-height:var(--s7);
  padding:0 var(--s5);border-radius:var(--r1);border:1.5px solid transparent;
  background:var(--accent);color:var(--on-accent);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
}
.btn.ghost{background:var(--panel);color:var(--t1);border-color:var(--line2)}
.btn.quiet{background:none;color:var(--t2);border-color:var(--line)}
.btn.danger{background:none;color:var(--danger);border-color:var(--line)}
.btn.block{display:flex;width:100%}
.btn:active{opacity:.85}
.btnrow{display:flex;gap:var(--s2);margin-top:var(--s3)}
.btnrow .btn{flex:1}

/* ===== 提示条 ===== */
.note{
  border-radius:var(--r2);padding:var(--s4);font-size:var(--f2);line-height:1.6;
  border:1px solid var(--line);background:var(--panel);color:var(--t2);
}
.note b{color:var(--t1);font-weight:600}
.note h3{margin:0 0 var(--s2);font-size:var(--f3);color:var(--t1);font-weight:620}
.note.info{background:var(--accent-soft);border-color:transparent}
.note.good{background:var(--ok-soft);border-color:transparent}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.bad{background:var(--danger-soft);border-color:transparent}
.note ul{margin:var(--s2) 0 0;padding-left:var(--s4)}
.note li{margin-bottom:var(--s1)}
.note + .note{margin-top:var(--s2)}

/* ===== 数据行 ===== */
.dl{display:flex;gap:var(--s3);align-items:baseline;padding:var(--s3) var(--s4);min-height:var(--s7)}
.dl .k{flex:1;min-width:0;font-size:var(--f2);color:var(--t2);overflow-wrap:anywhere}
.dl .k b{color:var(--t1);font-weight:600}
.dl .v{font-size:var(--f2);color:var(--t1);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right}
.dl .v.mute{color:var(--t3)}

/* 勾选行 */
.tick{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);min-height:var(--s7);cursor:pointer}
.tick .box{
  flex:0 0 22px;height:22px;margin-top:2px;border-radius:6px;border:1.5px solid var(--line2);
  background:var(--panel2);display:flex;align-items:center;justify-content:center;
  font-size:var(--f1);color:var(--on-accent);
}
.tick.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.tick .tx{flex:1;min-width:0;font-size:var(--f2);color:var(--t1)}
.tick.on .tx{color:var(--t3);text-decoration:line-through}
.tick .tx small{display:block;color:var(--t3);font-size:var(--f1);margin-top:2px;text-decoration:none}
.tick .tx small.buy{
  margin-top:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r1);
  background:var(--accent-soft);color:var(--t2);line-height:1.55;
}
.tick.on .tx small.buy{opacity:.5}
.tick .pz{font-size:var(--f1);color:var(--t3);flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ===== 指标 ===== */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4)}
.kpi .l{font-size:var(--f1);color:var(--t3)}
.kpi .v{font-size:var(--f4);font-weight:660;line-height:1.2;margin-top:var(--s1);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:var(--f2);font-weight:500;color:var(--t2);margin-left:2px}
.kpi .n{font-size:var(--f1);color:var(--t3);margin-top:2px}

/* ===== 阶梯 ===== */
.ladder{display:flex;gap:var(--s1);padding:var(--s4) var(--s4) var(--s2)}
.ladder span{
  flex:1;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:var(--f1);font-weight:650;background:var(--line);color:var(--t3);
}
.ladder span.past{background:var(--line2);color:var(--t2)}
.ladder span.cur{background:var(--t1);color:var(--bg)}

/* ===== 图表 ===== */
.chart{width:100%;display:block}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:var(--f1);color:var(--t2);padding:0 var(--s4) var(--s4)}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:3px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;padding:0 var(--s4) var(--s3)}
.heat div{aspect-ratio:1;border-radius:2px;background:var(--line)}
.heat div.h1{background:var(--accent-soft)}
.heat div.h2{background:var(--accent)}

/* ===== 日志 ===== */
.log{padding:var(--s3) var(--s4)}
.log .top{display:flex;align-items:center;gap:var(--s2);font-size:var(--f2)}
.log .tg{font-size:var(--f1);font-weight:700;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--t2)}
.log .dt{color:var(--t2);font-variant-numeric:tabular-nums}
.log .del{margin-left:auto;background:none;border:none;color:var(--t3);font-size:var(--f1);font-family:inherit;cursor:pointer;min-height:36px;padding:0 var(--s2)}
.log .bd{font-size:var(--f2);color:var(--t3);margin-top:2px}

/* ===== 计时器 ===== */
#timer{
  position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));
  background:var(--t1);color:var(--bg);padding:var(--s4);z-index:60;display:none;
  box-shadow:0 -8px 32px rgba(0,0,0,.22);
}
#timer.on{display:block}
#timer .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:var(--s4)}
#timer .n{font-size:var(--f6);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;min-width:110px}
#timer .lb{flex:1;font-size:var(--f2);opacity:.85;line-height:1.4}
#timer button{
  background:rgba(255,255,255,.16);border:none;color:inherit;font-family:inherit;
  font-size:var(--f2);font-weight:600;min-height:var(--s7);padding:0 var(--s4);border-radius:var(--r1);cursor:pointer;
}

/* ===== 底部导航 ===== */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--nav) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--panel);border-top:1px solid var(--line);display:flex;
}
nav button{
  flex:1;background:none;border:none;font-family:inherit;font-size:var(--f2);
  color:var(--t3);cursor:pointer;position:relative;font-weight:500;
}
nav button.on{color:var(--t1);font-weight:620}
nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--t1);border-radius:0 0 2px 2px}

/* ===== 设置 ===== */
#setup{position:fixed;inset:0;background:var(--bg);z-index:99;overflow-y:auto;display:none}
#setup.on{display:block}
.fl{display:block;font-size:var(--f1);color:var(--t3);margin-bottom:var(--s1)}
.fg{margin-bottom:var(--s3)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.daybar{display:flex;gap:var(--s1);margin-bottom:var(--s3)}
.daybar button{
  flex:1;min-height:var(--s7);border-radius:var(--r1);border:1.5px solid var(--line2);
  background:var(--panel2);color:var(--t2);font-family:inherit;font-size:var(--f2);font-weight:600;cursor:pointer;
}
.daybar button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s2)}
.card h3{margin:0 0 var(--s3);font-size:var(--f3);font-weight:620}

.foot{padding:var(--s6) 0 var(--s5);text-align:center;font-size:var(--f1);color:var(--t3);line-height:1.6}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div id="setup"><div class="wrap" style="padding-top:var(--s6);padding-bottom:var(--s7)"></div></div>

<div class="wrap">
  <header class="hd">
    <div>
      <div class="meta" id="hmeta"></div>
      <h1 id="htitle">今天</h1>
    </div>
    <button class="gear" onclick="openSetup(1)" aria-label="设置">⚙</button>
  </header>
  <div class="view on" id="v-today"></div>
  <div class="view" id="v-plan"></div>
  <div class="view" id="v-eat"></div>
  <div class="view" id="v-data"></div>
  <div class="foot">数据只存在这台设备的浏览器里<br>记得每周到数据页导出一次备份</div>
</div>

<div id="timer"><div class="inner">
  <div class="n" id="tnum">1:30</div>
  <div class="lb" id="tlb">组间休息</div>
  <button onclick="addTime(30)">+30</button>
  <button onclick="stopTimer()">跳过</button>
</div></div>

<nav>
  <button class="on" data-v="today">今天</button>
  <button data-v="plan">计划</button>
  <button data-v="eat">饮食</button>
  <button data-v="data">数据</button>
</nav>

<script>
/* ==================== 配置（键名与旧版一致，数据不丢） ==================== */
const DEF={
  sex:'男',age:22,height:175,w0:65,goal:'',
  kcal:2700,pro:130,
  start:'',days:[2,4,0],ttime:'21:00',
  disA:'',disB:'',
  level:3,rest:90,
  gear:['高桌或吧台','矮桌或床沿','稳固的椅子','矮凳或台阶','地面'],
  mt:['7:45','10:30','12:15','15:30','19:00','21:50']
};
const LS={
  get(k,d){try{const v=localStorage.getItem('bj_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bj_'+k,JSON.stringify(v))}catch(e){}}
};
let CFG=Object.assign({},DEF,LS.get('cfg',{}));
function saveCfg(){LS.set('cfg',CFG)}

/* ==================== 内容 ==================== */
const WARM=[
 {t:'手腕前后绕环各 15 圈（有大鱼际压迫痛的话必做）'},
 {t:'手腕屈伸拉伸每侧 20 秒',q:'手腕拉伸 教学'},
 {t:'猫牛式 10 次',q:'猫牛式 教学'},
 {t:'靠墙天使 10 次',q:'靠墙天使 教学'},
 {t:'臀桥 15 次',q:'臀桥 教学'},
 {t:'原地高抬腿 30 秒'}
];
const COOL=[
 {t:'胸小肌门框拉伸每侧 30 秒',q:'胸部 门框拉伸'},
 {t:'髂腰肌弓步拉伸每侧 30 秒（久坐人群别跳）',q:'髂腰肌拉伸 教学'},
 {t:'仰卧腹式呼吸 10 次，吸 4 秒呼 6 秒',q:'腹式呼吸 教学'}
];
const LNAME=['L1','L2','L3','L4','L5'];
const LPCT=[40,48,57,65,70];

};
function fkc(k,q){const f=FOOD[k];return f.kc*f.ug*q/100}
function fpr(k,q){const f=FOOD[k];return f.pr*f.ug*q/100}
function mealKc(m){return m.i.reduce((a,x)=>a+fkc(x[0],x[1]),0)}
function mealPr(m){return m.i.reduce((a,x)=>a+fpr(x[0],x[1]),0)}
function dayKc(){return MEALS.reduce((a,m)=>a+mealKc(m),0)}
function dayPr(){return MEALS.reduce((a,m)=>a+mealPr(m),0)}
/* 把餐单反推成一周用量，采购清单照这个对，就不会再出现买少了的情况 */
function weekNeed(){
  const t={};
  MEALS.forEach(m=>m.i.forEach(x=>{t[x[0]]=(t[x[0]]||0)+x[1]}));
  return Object.keys(t).map(function(k){
    const f=FOOD[k],w=t[k]*7;
    return {n:f.n,d:t[k],w:w,u:f.u,g:Math.round(w*f.ug)};
  });
}

/* ==================== 工具 ==================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const WD=['周日','周一','周二','周三','周四','周五','周六'];
const isTD=d=>CFG.days.indexOf(d.getDay())>=0;
const inDis=d=>{const t=ymd(d);return CFG.disA&&CFG.disB&&t>=CFG.disA&&t<=CFG.disB};
function sessionOf(d){
  if(!isTD(d))return{k:'rest'};
  if(inDis(d))return{k:'M'};
  let n=0,c=pd(CFG.start||TK),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()),g=0;
  if(isNaN(c)||e<c)return{k:'rest'};
  while(c<=e&&g++<4000){if(isTD(c)&&!inDis(c))n++;c.setDate(c.getDate()+1)}
  return{k:n%2===1?'A':'B',n:n};
}
const today=new Date(),TK=ymd(today);
const sk=(dk,t,i)=>'set_'+dk+'_'+t+'_'+i;
const rk=(dk,t,i)=>'reps_'+dk+'_'+t+'_'+i;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ==================== 计时器 ==================== */
let tId=null,tLeft=0,actx=null;
function initAudio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function beep(){
  if(actx)try{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.35,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch(e){}
  if(navigator.vibrate)navigator.vibrate([220,110,220]);
}
function fmt(s){return s>=60?Math.floor(s/60)+':'+pad(s%60):'0:'+pad(Math.max(0,s))}
function startTimer(sec,label){initAudio();tLeft=sec;$('#tlb').textContent=label||'组间休息';$('#timer').classList.add('on');pt();
  clearInterval(tId);tId=setInterval(()=>{tLeft--;pt();if(tLeft<=0){clearInterval(tId);tId=null;beep();$('#tlb').textContent='休息结束，开始下一组';setTimeout(stopTimer,4000)}},1000)}
function pt(){$('#tnum').textContent=fmt(tLeft)}
function addTime(s){if(tId){tLeft+=s;pt()}}
function stopTimer(){clearInterval(tId);tId=null;$('#timer').classList.remove('on');$('#tlb').textContent='组间休息'}

/* ==================== 进阶 ==================== */
function parseReps(s){return String(s||'').split(/[^0-9]+/).filter(Boolean).map(Number)}
function lastReps(t,i){const idx=LS.get('repsIdx',[]).slice().reverse();
  for(let j=0;j<idx.length;j++){const e=idx[j];if(e.t===t&&e.i===i&&e.d!==TK)return e}return null}
function noteReps(dk,t,i,v){
  LS.set(rk(dk,t,i),v);
  let idx=LS.get('repsIdx',[]).filter(e=>!(e.d===dk&&e.t===t&&e.i===i));
  if(String(v).trim())idx.push({d:dk,t:t,i:i,v:v});
  idx.sort((a,b)=>a.d<b.d?-1:1);LS.set('repsIdx',idx);drawToday();
}
function canLevelUp(){
  const idx=LS.get('repsIdx',[]).filter(e=>e.i===0&&e.t==='A');
  if(!idx.length)return false;
  const r=parseReps(idx[idx.length-1].v);
  return r.length>=4&&r.every(x=>x>=15);
}
function levelUp(){
  if(CFG.level>=5){alert('已经在 L5 地面标准俯卧撑了。接下来是累积次数，目标 3 组 10 个。');return}
  if(!confirm('确认进阶到 '+LNAME[CFG.level]+'？下次训练从 4 组 8 次重新开始。'))return;
  const h=LS.get('levelhist',[]);h.push({d:TK,from:CFG.level,to:CFG.level+1});LS.set('levelhist',h);
  CFG.level++;saveCfg();drawAll();
  alert('已进阶到 '+LNAME[CFG.level-1]+'。别急着冲次数，回到 4 组 8 次，每组留 2 次余量。');
}

function progressOf(dk,t){const l=EX[t];if(!l)return[0,0];let d=0,s=0;
  for(let i=0;i<l.length;i++){s+=l[i].s;d+=LS.get(sk(dk,t,i),[]).length}return[d,s]}
function firstUndone(dk,t){const l=EX[t];for(let i=0;i<l.length;i++){if(LS.get(sk(dk,t,i),[]).length<l[i].s)return i}return -1}
function everTrained(){
  try{return Object.keys(localStorage).some(function(k){

}

function tog(i){openEx=(openEx===i?-1:i);drawToday();}
function hit(t,i,j,el){
  const k=sk(TK,t,i);let d=LS.get(k,[]);
  if(d.indexOf(j)>=0)d=d.filter(x=>x!==j);else{d.push(j);startTimer(CFG.rest,'组间休息 · 下一组第 '+(d.length+1>EX[t][i].s?EX[t][i].s:d.length+1)+' 组')}
  LS.set(k,d);el.classList.toggle('on');
  const ex=el.closest('.ex'),tot=EX[t][i].s;
  ex.classList.toggle('done',d.length>=tot);
  ex.querySelector('.tally').textContent=d.length+'/'+tot;
  ex.querySelector('.idx').textContent=d.length>=tot?'✓':(i+1);
  const p=progressOf(TK,t),pct=p[1]?Math.round(p[0]/p[1]*100):0;
  const bar=$('#v-today .track i');if(bar)bar.style.width=pct+'%';
  const tx=$('#pgtxt');if(tx)tx.textContent=p[0]+' / '+p[1]+' 组 · '+pct+'%';
}

/* ==================== 图表 ==================== */
function weightChart(ws){
  if(ws.length<2)return '<div class="note">至少记两天体重才能画曲线，现在有 '+ws.length+' 天。</div>';
  const W=600,H=190,PL=42,PR=12,PT=12,PB=26;
  const xs=i=>PL+i*(W-PL-PR)/Math.max(1,ws.length-1);
  const v=ws.map(x=>x.w);let mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);
  const p=Math.max(.6,(mx-mn)*.3);mn-=p;mx+=p;
  const ys=x=>PT+(mx-x)*(H-PT-PB)/((mx-mn)||1);
  const ma=ws.map(function(_,i){const s=ws.slice(Math.max(0,i-6),i+1);return s.reduce((a,b)=>a+b.w,0)/s.length});
  let g='';
  for(let k=0;k<=3;k++){const val=mn+(mx-mn)*k/3,y=ys(val);
    g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="currentColor" stroke-opacity=".12"/>'
      +'<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".45">'+val.toFixed(1)+'</text>'}
  return '<div class="panel" style="color:var(--t1)"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="height:190px;padding:var(--s3) 0 0">'
    +g
    +'<polyline points="'+ws.map((x,i)=>xs(i).toFixed(1)+','+ys(x.w).toFixed(1)).join(' ')+'" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>'
    +ws.map((x,i)=>'<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(x.w).toFixed(1)+'" r="2.5" fill="currentColor" fill-opacity=".35"/>').join('')
    +'<polyline points="'+ma.map((x,i)=>xs(i).toFixed(1)+','+ys(x).toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<text x="'+PL+'" y="'+(H-6)+'" font-size="11" fill="currentColor" fill-opacity=".45">'+ws[0].d.slice(5)+'</text>'
    +'<text x="'+(W-PR)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".45">'+ws[ws.length-1].d.slice(5)+'</text>'
    +'</svg><div class="legend"><span><i style="background:var(--accent)"></i>7 天均值，看这条</span><span><i style="background:currentColor;opacity:.35"></i>每日实测</span></div></div>';
}
function heatmap(){
  const done={};
  try{Object.keys(localStorage).forEach(function(k){const m=k.match(/^bj_set_(\d{4}-\d{2}-\d{2})_/);
    if(m){try{if(JSON.parse(localStorage.getItem(k)).length)done[m[1]]=(done[m[1]]||0)+1}catch(e){}}})}catch(e){}
  LS.get('logs',[]).forEach(l=>{done[l.d]=Math.max(done[l.d]||0,1)});
  let c=new Date(today);c.setDate(c.getDate()-55);let cells='';
  for(let i=0;i<56;i++){const k=ymd(c),n=done[k]||0;cells+='<div class="'+(n>=4?'h2':n>0?'h1':'')+'" title="'+k+'"></div>';c.setDate(c.getDate()+1)}
  return '<div class="panel"><div style="padding:var(--s4) var(--s4) var(--s2);font-size:var(--f2);color:var(--t2)">最近 8 周</div>'
    +'<div class="heat">'+cells+'</div>'
    +'<div class="legend"><span><i style="background:var(--accent);width:10px;height:10px;border-radius:2px"></i>完整</span>'
    +'<span><i style="background:var(--accent-soft);width:10px;height:10px;border-radius:2px"></i>部分</span>'
    +'<span><i style="background:var(--line);width:10px;height:10px;border-radius:2px"></i>没练</span></div></div>';
}

    :'<div class="dl"><div class="k">还没有进阶记录。四组都做到 15 次时，今天那页会弹出进阶按钮。</div></div>';

  if(logs.length)h+='<div class="gt">训练记录　共 '+logs.length+' 次</div><div class="panel">'
    +logs.slice().reverse().slice(0,30).map(l=>'<div class="log rowline"><div class="top"><span class="tg">'+l.t+'</span><span class="dt">'+l.d+'</span>'
    +'<button class="del" onclick="delL(\''+l.id+'\')">删除</button></div><div class="bd">'+esc(l.n||'无备注')+'</div></div>').join('')+'</div>';
  h+='<div class="gt">备份</div>'
    +'<div class="note bad"><b>清一次浏览器数据，所有记录就没了。</b>没有云端没有账号，全在这台设备上。建议每周日备餐时顺手导出一次，文件发到微信收藏。</div>'

function addW(){const v=parseFloat($('#wIn').value);if(!v||v<25||v>250)return;
  let ws=LS.get('weights',[]).filter(x=>x.d!==TK);ws.push({d:TK,w:v});ws.sort((a,b)=>a.d<b.d?-1:1);LS.set('weights',ws);drawData()}
function addL(){const n=$('#lgN').value.trim();if(!n)return;const s=sessionOf(today);
  const l=LS.get('logs',[]);l.push({id:String(Date.now()),d:TK,t:s.k==='rest'?'M':s.k,n:n});LS.set('logs',l);drawData()}
function delL(id){LS.set('logs',LS.get('logs',[]).filter(x=>x.id!==id));drawData()}
function dump(){const o={};try{Object.keys(localStorage).forEach(k=>{if(k.indexOf('bj_')===0)o[k]=localStorage.getItem(k)})}catch(e){}
  return JSON.stringify({app:'bj',v:2,at:TK,d:o})}
function expData(){try{const b=new Blob([dump()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='薄肌训练备份_'+TK+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1000)}catch(e){alert('下载失败，改用复制到剪贴板')}}
function expClip(){const s=dump();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>alert('已复制，粘到备忘录或微信收藏存好'),()=>prompt('手动复制',s));
  else prompt('手动复制',s)}
function impData(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=function(){try{const j=JSON.parse(r.result);if(!j||!j.d)throw new Error('bad');
    if(!confirm('会用备份完全覆盖当前数据，确定吗？'))return;
    Object.keys(localStorage).filter(k=>k.indexOf('bj_')===0).forEach(k=>localStorage.removeItem(k));
    Object.keys(j.d).forEach(k=>localStorage.setItem(k,j.d[k]));
    alert('已恢复 '+(j.at||'')+' 的备份');location.reload()}catch(err){alert('这个文件不是有效的备份')}};
  r.readAsText(f)}
function wipe(){if(!confirm('会删掉所有训练记录、体重、进阶历史和设置，确定吗？'))return;
  if(!confirm('最后确认。建议先导出备份。真的要清空？'))return;
  Object.keys(localStorage).filter(k=>k.indexOf('bj_')===0).forEach(k=>localStorage.removeItem(k));location.reload()}

   +'<div class="fg"><label class="fl">组间休息 秒</label><input type="number" id="s_rest" value="'+c.rest+'" inputmode="numeric"></div></div>'
   +'<div class="fg" style="margin:0"><label class="fl">起始日（第一次训练那天，练 A）</label><input type="text" id="s_start" value="'+esc(c.start||TK)+'" placeholder="2026-01-01"></div></div>'
   +'<div class="card"><h3>高度阶梯</h3><p style="font-size:var(--f1);color:var(--t3);margin:0 0 var(--s3)">写下每一档打算用什么，留空也行</p>'
   +LNAME.map((n,i)=>'<div class="fg"><label class="fl">'+n+'　负荷约 '+LPCT[i]+'% 体重</label><input type="text" id="s_g'+i+'" value="'+esc(c.gear[i]||'')+'" placeholder="'+DEF.gear[i]+'"></div>').join('')
   +'<div class="fg" style="margin:0"><label class="fl">当前档位</label><select id="s_lv">'+LNAME.map((n,i)=>'<option value="'+(i+1)+'" '+(c.level===i+1?'selected':'')+'>'+n+'</option>').join('')+'</select></div></div>'
   +'<div class="card"><h3>用餐时间</h3><div class="f2">'+MEALS.map((m,i)=>'<div class="fg"><label class="fl">'+m.n+'</label><input type="text" id="s_m'+i+'" value="'+esc(c.mt[i]||'')+'"></div>').join('')+'</div></div>'
   +'<div class="card"><h3>作息打乱期</h3><p style="font-size:var(--f1);color:var(--t3);margin:0 0 var(--s3)">这段时间自动切成维持版。两个都留空则不启用。</p>'
   +'<div class="f2"><div class="fg" style="margin:0"><label class="fl">开始</label><input type="text" id="s_da" value="'+esc(c.disA||'')+'" placeholder="2026-01-01"></div>'
   +'<div class="fg" style="margin:0"><label class="fl">结束</label><input type="text" id="s_db" value="'+esc(c.disB||'')+'" placeholder="2026-01-14"></div></div></div>'
   +'<div class="card"><h3>热量目标</h3><p id="calc" style="font-size:var(--f1);color:var(--t3);margin:0 0 var(--s3)"></p>'
   +'<div class="f2"><div class="fg" style="margin:0"><label class="fl">千卡</label><input type="number" id="s_kc" value="'+c.kcal+'" inputmode="numeric"></div>'
   +'<div class="fg" style="margin:0"><label class="fl">蛋白质 克</label><input type="number" id="s_pr" value="'+c.pro+'" inputmode="numeric"></div></div>'
   +'<button class="btn quiet block" style="margin-top:var(--s3)" onclick="autoCal()">按身高体重重算</button></div>'
   +'<button class="btn block" style="margin-top:var(--s4)" onclick="saveSetup()">'+(edit?'保存':'开始使用')+'</button>'
   +(edit?'<button class="btn quiet block" style="margin-top:var(--s2)" onclick="closeSetup()">取消</button>':'')
   +'<div style="height:var(--s7)"></div>';
  $('#setup').classList.add('on');autoK=!edit;updCalc();if(!edit)autoCal();
}
function tglDay(d,el){const i=CFG.days.indexOf(d);
  if(i>=0){if(CFG.days.length<=1)return;CFG.days.splice(i,1);el.classList.remove('on')}
  else{CFG.days.push(d);CFG.days.sort();el.classList.add('on')}}
function bmr(){const s=$('#s_sex').value,a=+$('#s_age').value||22,h=+$('#s_h').value||170,w=+$('#s_w').value||60;
  return 10*w+6.25*h-5*a+(s==='男'?5:-161)}
function updCalc(){const el=$('#calc');if(!el)return;const b=bmr();
  el.textContent='估算：基础代谢约 '+Math.round(b)+' 千卡，日常消耗约 '+Math.round(b*1.45)+' 千卡。增肌在此基础上加 250 到 300。'}
function autoCal(){$('#s_kc').value=Math.round((Math.round(bmr()*1.45)+280)/10)*10;$('#s_pr').value=Math.round((+$('#s_w').value||60)*2);updCalc()}
function saveSetup(){
  const st=$('#s_start').value.trim()||TK;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st)){alert('起始日要写成 2026-01-01 这种格式');return}
  const g=[];for(let i=0;i<5;i++)g.push($('#s_g'+i).value.trim());
  const mt=[];for(let i=0;i<MEALS.length;i++)mt.push($('#s_m'+i).value.trim());
  CFG.sex=$('#s_sex').value;CFG.age=+$('#s_age').value||22;CFG.height=+$('#s_h').value||170;
  CFG.w0=+$('#s_w').value||60;CFG.goal=$('#s_goal').value.trim()||sugGoal(CFG.height);
  CFG.ttime=$('#s_tt').value.trim()||'21:00';CFG.rest=Math.max(20,+$('#s_rest').value||90);
  CFG.start=st;CFG.gear=g;CFG.level=+$('#s_lv').value||3;CFG.mt=mt;
  CFG.disA=$('#s_da').value.trim();CFG.disB=$('#s_db').value.trim();
  CFG.kcal=+$('#s_kc').value||2700;CFG.pro=+$('#s_pr').value||130;CFG.done=1;
  saveCfg();$('#setup').classList.remove('on');openEx=-1;drawAll();
}
function closeSetup(){CFG=Object.assign({},DEF,LS.get('cfg',{}));$('#setup').classList.remove('on');drawAll()}

/* ==================== 启动 ==================== */
const TITLES={today:'今天',plan:'计划',eat:'饮食',data:'数据'};
function go(v){
  const b=document.querySelector('nav button[data-v="'+v+'"]');if(!b)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('#v-'+v).classList.add('on');window.scrollTo(0,0);
  if(v==='eat')drawEat();if(v==='data')drawData();if(v==='plan')drawPlan();
  $('#htitle').textContent=TITLES[v];
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
function drawAll(){
  $('#hmeta').textContent=(today.getMonth()+1)+' 月 '+today.getDate()+' 日　'+WD[today.getDay()];
  drawToday();drawPlan();drawEat();drawData();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=function(){initAudio();go(b.dataset.v)});
document.addEventListener('input',function(e){
  const id=e.target&&e.target.id;if(!id)return;
  if(id==='s_kc'||id==='s_pr'){autoK=false;return}
  if(/^s_(sex|age|h|w)$/.test(id)){updCalc();
    if(autoK){autoCal();const g=$('#s_goal');if(g&&!g.dataset.t)g.value=sugGoal(+$('#s_h').value)}}
  if(id==='s_goal')e.target.dataset.t='1';
});
document.addEventListener('touchstart',initAudio,{once:true});
document.addEventListener('click',initAudio,{once:true});
drawAll();
go((location.hash||'#today').slice(1));
if(!LS.get('cfg',null))openSetup(0);
</script>
</body>
</html>
